name: docker hub image

# 触发条件：push 到 main 且后端、前端或本 workflow 有改动；也支持手动触发
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web-pc/**'
      - '.github/workflows/docker-image.yml'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 先构建最新前端，产物覆盖到 backend/src/main/resources/public/
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-pc/pnpm-lock.yaml
      - name: Build web-pc
        working-directory: web-pc
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Copy frontend dist into backend resources
        run: |
          rm -rf backend/src/main/resources/public
          cp -r web-pc/dist backend/src/main/resources/public

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: markliu2018/moneynote:latest
