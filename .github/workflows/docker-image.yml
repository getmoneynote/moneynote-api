name: docker hub image

# 触发条件：push 到 main 且影响镜像内容的文件有改动；也支持手动触发。
# entrypoint.sh / .dockerignore 已从 backend/ 移到根目录，脱离了 backend/** 的覆盖范围，
# 必须显式列出，否则改了它们不会重打镜像。
# docker-compose*.yml 不影响推送的镜像，故不列入（避免无谓的多平台构建）。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'web-pc/**'
      - 'Dockerfile'
      - 'entrypoint.sh'
      - '.dockerignore'
      - '.github/workflows/docker-image.yml'


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASS }}
      # 根 Dockerfile 为多阶段构建：前端（pnpm build）→ 后端（mvn package）→ 运行时
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: markliu2018/moneynote:latest
