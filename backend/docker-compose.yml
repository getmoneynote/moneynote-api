version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneynote
    restart: unless-stopped
    ports:
      - "9098:9096"
    volumes:
      # H2 文件库：容器内 WORKDIR 为 /app，DbType.H2 的 jdbc:h2:file:./data/%s
      # 会写入 moneynote.mv.db / moneynote.lock.db，容器重建后必须保留
      - ./data:/app/data
      # 安装向导生成的 db-config.properties。不挂载时 isConfigured()==false，
      # 应用会进入 setup 模式并把所有请求 302 到 /setup，即使 .mv.db 还在也无法使用
      - ./config:/app/config
    # entrypoint.sh 收到 TERM 后要转发给 java、等 Spring 关闭并 flush H2，
    # 默认 10s 的停止宽限期偏紧，给足时间避免硬杀导致脏数据/残留 lock 文件
    stop_grace_period: 30s
