version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moneynote-backend
    restart: unless-stopped
    ports:
      - "9098:9096"
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
    environment:
      SPRING_DEVTOOLS_RESTART_ENABLED: true