# Chat / Agent
# ==========================================================
error.chat.agent.unknown=Unknown AI agent. Please pick one from the menu.
error.chat.block.not.found=Message or form not found. Please refresh and try again.
error.chat.block.not.form=This content is not a submittable form.
error.chat.block.not.pending=This form has already been submitted.
error.chat.block.action.unsupported=Unsupported form action. Please refresh and try again.
error.chat.block.form.invalid=The form is incomplete or invalid. Please check the amount and category.

error.book.not.found=Current book not found
error.book.remove.current=Cannot delete the current book

error.category.type.mismatch=Category type mismatch
error.category.max.level=Categories support up to 4 levels
error.category.parent.self=A category cannot be its own parent
error.category.parent.descendant=A category cannot be moved under its own descendant
error.category.remove.hasChildren=Cannot delete a category that has subcategories

