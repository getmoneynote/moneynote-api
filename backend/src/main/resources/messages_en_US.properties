# ==========================================================
# 业务 / 自定义国际化消息（英文）
# ==========================================================
# 分工约定：Bean Validation 框架自带的标准校验 key
# （jakarta.validation.* / org.hibernate.validator.*）放 ValidationMessages_en_US.properties；
# 业务消息、业务校验、自定义校验 key（validation.*、error.*、resource.*）放本文件。

# ==========================================================
# 资源名词表（用于填充模板中的 {0}，非独立文案）
# ==========================================================
resource.currency=Currency
resource.account=Account
resource.book=Book
resource.category=Category
resource.tag=Tag
resource.payee=Payee
resource.reminder=Reminder
resource.moneyFlow=Money Flow
resource.llmConfig=AI Config
resource.conversation=Conversation

# ==========================================================
# 全局 / 框架级错误（与具体业务领域无关）
# ==========================================================
error.validation.failed=Validation failed
error.invalid.argument=Invalid request parameter
error.route.not.found=Resource not found
error.unknown=Unknown error
error.reference.constraint=This resource is referenced by other data and cannot be deleted
error.data.integrity=Data integrity conflict

error.auth.token.missing=Please log in first
error.auth.token.invalid=Session expired, please log in again
error.auth.forbidden=You do not have permission to access this resource

# ==========================================================
# 通用资源错误模板（配合 BusinessException 的 args 使用）
# ==========================================================
error.resource.not.found={0} not found
error.resource.duplicate={0} already exists
error.resource.referenced={0} is referenced by other data and cannot be deleted
# args: [fieldLabel, fieldValue]
error.resource.duplicate.field={0} {1} already exists

# ==========================================================
# 业务领域 Validation
# ==========================================================
validation.user.username.size=Username length must be between {min} and {max}
validation.user.username.pattern=Username can only contain letters, numbers and underscores
validation.user.username.invalid=Invalid username format
validation.user.password.size=Password length must be between {min} and {max}
validation.user.password.invalid=Invalid password format

validation.currency.code.pattern=Currency code must be 3 uppercase letters (e.g. CNY)
# Unix 毫秒时间戳取值范围（@Min/@Max 通用）
validation.timestamp.invalid=Not a valid date timestamp


# ==========================================================
# 业务领域 异常
# (资源.动作.结果)
# ==========================================================
error.user.register.conflict=Username already exists
error.user.register.invite.wrong=Invalid invite code
error.user.login.credentials.wrong=Incorrect username or password

error.currency.update.usd=The USD exchange rate cannot be modified
error.currency.remove.protected=System currencies cannot be deleted
error.currency.remove.base=Cannot delete the current base currency. Switch the base currency first.
error.currency.base.missing=Base currency is missing or invalid

