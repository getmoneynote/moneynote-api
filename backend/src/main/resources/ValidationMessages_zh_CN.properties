# ==========================================================
# Jakarta / Hibernate Bean Validation 系统级校验消息（简体中文）
# ==========================================================
# 本文件只放 Bean Validation 框架自带的标准 message key：
#   jakarta.validation.constraints.* / org.hibernate.validator.constraints.*
# 自定义校验消息（validation.*）一律放 messages_zh_CN.properties，不要放这里。

jakarta.validation.constraints.NotNull.message=不能为空
jakarta.validation.constraints.NotBlank.message=不能为空
jakarta.validation.constraints.NotEmpty.message=不能为空
jakarta.validation.constraints.Size.message=长度不能超过{max}个字符
jakarta.validation.constraints.Positive.message=必须大于 0
jakarta.validation.constraints.PositiveOrZero.message=必须大于或等于 0
jakarta.validation.constraints.Digits.message=整数部分最多 {integer} 位，小数部分最多 {fraction} 位
org.hibernate.validator.constraints.Range.message=必须在 {min}-{max} 之间