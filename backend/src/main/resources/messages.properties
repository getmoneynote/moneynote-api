# ==========================================================
# 业务 / 自定义国际化消息
# ==========================================================
# 分工约定：Bean Validation 框架自带的标准校验 key
# （jakarta.validation.* / org.hibernate.validator.*）放 ValidationMessages.properties；
# 业务消息、业务校验、自定义校验 key（validation.*、error.*、resource.*）放本文件。
#
# 本文件是「默认回退语言」版本（中文）：某个 locale 文件缺少 key 时最终回退到这里，
# 改中文文案时需与 messages_zh_CN.properties 同步。

# ==========================================================
# 资源名词表（用于填充模板中的 {0}，非独立文案）
# ==========================================================
resource.currency=币种
resource.account=账户
resource.book=账本
resource.category=分类
resource.tag=标签
resource.payee=交易对象
resource.reminder=提醒事项
resource.moneyFlow=账单
resource.llmConfig=AI 配置
resource.conversation=会话

# ==========================================================
# 全局 / 框架级错误（与具体业务领域无关）
# ==========================================================
error.validation.failed=参数校验失败
error.invalid.argument=请求参数无效
error.route.not.found=请求的资源不存在
error.unknown=未知异常
error.reference.constraint=该资源被其他数据引用，无法删除
error.data.integrity=数据完整性冲突

error.auth.token.missing=请先登录
error.auth.token.invalid=登录状态已失效，请重新登录
error.auth.forbidden=无权限访问该资源

# ==========================================================
# 通用资源错误模板（配合 BusinessException 的 args 使用）
# ==========================================================
error.resource.not.found={0} 不存在
error.resource.duplicate={0} 已存在
error.resource.referenced={0} 被其他数据引用，无法删除
# args: [fieldLabel, fieldValue]
error.resource.duplicate.field={0} {1} 已存在

# ==========================================================
# 业务领域 Validation
# ==========================================================
validation.user.username.size=用户名长度需在{min}-{max}之间
validation.user.username.pattern=用户名只能包含字母、数字、下划线
validation.user.username.invalid=用户名格式不正确
validation.user.password.size=密码长度需在{min}-{max}之间
validation.user.password.invalid=密码格式不正确

validation.currency.code.pattern=货币代码必须为 3 位大写字母（如 CNY）
# Unix 毫秒时间戳取值范围（@Min/@Max 通用）
validation.timestamp.invalid=不是有效的日期时间戳


# ==========================================================
# 业务领域 异常
# (资源.动作.结果)
# ==========================================================
error.user.register.conflict=用户名已存在
error.user.register.invite.wrong=邀请码错误
error.user.login.credentials.wrong=用户名或密码错误

error.currency.update.usd=不能修改 USD 货币汇率
error.currency.remove.protected=不能删除系统货币
error.currency.remove.base=不能删除当前本位币，请先切换本位币
error.currency.base.missing=本位币数据异常，未设置或已失效

# ==========================================================
# Chat 聊天 / Agent
# ==========================================================
error.chat.agent.unknown=未知的 AI 助手，请从左侧菜单重新选择
error.chat.block.not.found=消息或表单不存在，请刷新后重试
error.chat.block.not.form=该内容不是可提交的表单
error.chat.block.not.pending=该表单已提交，请勿重复提交
error.chat.block.action.unsupported=不支持的表单提交动作，请刷新后重试
error.chat.block.form.invalid=表单内容不完整或不合法，请检查金额与分类后再提交

error.book.not.found=当前账本不存在
error.book.remove.current=不能删除当前账本

error.category.type.mismatch=分类类型不匹配
error.category.max.level=分类最多支持 4 级
error.category.parent.self=不能将分类设为自己的子级
error.category.parent.descendant=不能将分类移动到自己的后代节点下
error.category.remove.hasChildren=存在子分类，无法删除

# ==========================================================
# Account 账户
# ==========================================================
error.account.adjust.balance.same=目标余额与当前余额相同

# ==========================================================
# MoneyFlow 收支流水
# ==========================================================
error.moneyflow.to.account.same=转入账户不能与转出账户相同
error.moneyflow.converted.amount.required=币种不一致时必须填写换算金额
error.moneyflow.transfer.amount.negative=转账金额不能为负数

# ==========================================================
# LLM 配置
# ==========================================================
error.llm.config.not.activated=尚未选择 AI 配置，请先在 AI 配置页添加并设为当前
error.llm.config.test.failed=连接测试失败，请检查 Base URL、API Key 和模型名
